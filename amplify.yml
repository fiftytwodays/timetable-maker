version: 1
backend:
  phases:
    build:
      commands:
        # Not `npm ci`: @aws-amplify/data-construct bundles @opentelemetry
        # packages that disagree on @opentelemetry/core, which `npm ci` rejects.
        - npm install --cache .npm --prefer-offline --no-audit --no-fund
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: out
    files:
      - "**/*"
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
